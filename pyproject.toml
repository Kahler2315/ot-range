[project]
name = "ot-range"
version = "0.1.0"
description = "Open-source OT/ICS cyber range simulating a municipal water pump station over Modbus TCP"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
  "S101", # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["common", "process_sim", "sensor", "tools", "attacker", "tests", "scenarios", "panel"]

[tool.ruff.lint.per-file-ignores]
# The test harness launches repo modules with sys.executable and
# literal argument lists — no shell, no external input.
"tests/harness.py" = ["S603"]
# Docker CLI invocations with literal argument lists — no shell, no
# external input. "docker" as a bare command is deliberate: it must
# resolve via PATH the same way it would for any user running these
# tests, not a pinned path that varies by install method. S310: the
# urlopen call here only ever targets a URL this repo constructs itself
# (http://127.0.0.1:PORT), never user/attacker input.
"tests/docker_harness.py" = ["S603", "S607", "S310"]
"tests/test_openplc_integration.py" = ["S603", "S607"]
"tests/test_historian.py" = ["S603", "S607"]
"tests/test_router.py" = ["S603", "S607"]
# "ip" as a bare command, no shell, no external input — same reasoning
# as the docker-cli entries above. Runs inside the router container only.
"router/find_iface.py" = ["S607"]
# Interactive menu dispatches to a fixed, hardcoded table of commands
# (make/bash targets already in this repo) — no shell, no external or
# user-controlled input reaches subprocess.run's argument list.
"scenarios/menu.py" = ["S603", "S607"]
# "docker inspect" as a bare command, no shell — same reasoning as the
# docker-cli entries above.
"tools/status.py" = ["S603", "S607"]
# Web control panel: every subprocess call dispatches a fixed,
# hardcoded command (make targets, scenario runners already in this
# repo) — no shell, no user/network input reaches the argument list.
"panel/app.py" = ["S603", "S607"]
# OpenPLC's shipped default credential (openplc/openplc), not a secret —
# see docs/openplc-integration.md. E501: the inline nosemgrep rule IDs
# that suppress the corresponding semgrep finding are unavoidably long.
"tools/openplc_configure.py" = ["S105", "E501"]
# 0.0.0.0 is correct: binds inside the container's own network namespace
# so docker-compose can publish/route to it. See process_sim/Dockerfile
# for the same reasoning.
"hmi/app.py" = ["S104"]

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: end-to-end attack/detection tests that start real processes and sockets",
  "docker: tests that build/run Docker containers (OpenPLC integration) — skipped if Docker isn't reachable",
]
