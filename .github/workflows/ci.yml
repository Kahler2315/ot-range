name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: gitleaks (secret scan)
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git=false --redact -v

      - name: ruff lint
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: bandit
        run: bandit -c pyproject.toml -r .

      - name: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit

      - name: Unit tests
        # Excludes docker-marked tests deliberately — those build real
        # containers (OpenPLC from source, now Zeek/Suricata too) and
        # belong in openplc-integration.yml's separate, slower job so
        # this one stays fast on every push. Matches `make test`.
        run: pytest -m "not e2e and not docker and not browser"

      - name: Smoke test
        run: PYTHON=python bash tests/smoke.sh

      # The differentiator: every attack scenario is run for real and its
      # detection asserted to fire, so a rule cannot silently rot.
      - name: Attack/detection regression tests
        run: pytest -m e2e

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  browser-rendering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify browser availability
        run: |
          google-chrome --version || chromium --version
          firefox --version

      - name: Chromium and Firefox map rendering
        env:
          OT_RANGE_BROWSER_ARTIFACT_DIR: /tmp/ot-range-browser-artifacts
        run: pytest -m browser -v

      - name: Upload map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-map-browser-screenshots
          path: /tmp/ot-range-browser-artifacts
          if-no-files-found: warn
